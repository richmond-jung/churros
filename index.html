<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1a10">
  <title>사원협의체가 쏩니다! 11/11(수) 츄러스 + 핫초코</title>
  <meta name="description" content="생명과학 사원협의체(마곡) 11월 11일(수) 11:30~14:30 E14동 남측 출입구 쪽">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #2b1a10;
      --glow: #6b3f1d;
      --paper: #fff6e2;
      --ink: #3b2417;
      --soft: #8a6a52;
      --accent: #d9692b;
      --line: #dcc8a6;
      --sans: "Gowun Dodum", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      --display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    /* 상단에 은은한 전구 불빛 같은 온기 */
    body::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 620px;
      background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(217, 105, 43, 0.38), transparent 72%);
      pointer-events: none;
    }
    .page {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(22px + env(safe-area-inset-top, 0px)) 18px calc(30px + env(safe-area-inset-bottom, 0px));
    }

    /* 포스터 액자 */
    .frame {
      margin: 0;
      padding: 8px;
      background: #fbf3e0;
      border-radius: 26px;
      box-shadow: 0 2px 0 rgba(255, 255, 255, 0.25) inset, 0 22px 40px -14px rgba(0, 0, 0, 0.6);
    }
    .frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 19px;
    }

    /* 확인 티켓 */
    .ticket {
      position: relative;
      margin-top: 18px;
      background: var(--paper);
      border-radius: 22px;
      box-shadow: 0 18px 34px -16px rgba(0, 0, 0, 0.65);
      animation: rise 0.7s 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .ticket-top {
      padding: 26px 24px 24px;
      text-align: center;
    }
    .ticket-top h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: 30px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .ticket-top p {
      margin: 10px 0 0;
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--soft);
    }
    .ticket-top p b {
      color: var(--accent);
      font-weight: 400;
    }

    /* 절취선 */
    .tear {
      position: relative;
      height: 0;
      margin: 0 22px;
      border-top: 2px dashed var(--line);
    }
    .tear::before,
    .tear::after {
      content: "";
      position: absolute;
      top: -12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--page);
    }
    .tear::before { left: -34px; }
    .tear::after { right: -34px; }

    .ticket-bottom {
      padding: 20px 24px 26px;
      text-align: center;
    }
    .date {
      font-size: 15px;
      color: var(--soft);
    }
    .time {
      margin-top: 2px;
      font-family: var(--display);
      font-size: 44px;
      line-height: 1.15;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--soft);
    }
    .live i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3aa86b;
      box-shadow: 0 0 0 0 rgba(58, 168, 107, 0.5);
      animation: pulse 1.8s ease-out infinite;
    }

    .sign {
      margin: 22px 0 0;
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: #cdb293;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(58, 168, 107, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(58, 168, 107, 0); }
      100% { box-shadow: 0 0 0 0 rgba(58, 168, 107, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ticket, .live i { animation: none; }
    }
    @media (min-width: 600px) {
      .page { padding-top: 40px; }
    }
  </style>
</head>

  <script>
    (function () {
      var days = ["일", "월", "화", "수", "목", "금", "토"];
      var dateEl = document.getElementById("date");
      var timeEl = document.getElementById("time");
      function pad(n) { return n < 10 ? "0" + n : "" + n; }
      function tick() {
        var d = new Date();
        dateEl.textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + days[d.getDay()] + ")";
        timeEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
